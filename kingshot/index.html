<title>왕관 전쟁</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen mobile 4X — resource strip, active view (kingdom canvas / expedition / defense / heroes), bottom tabs; battles are a full-screen canvas layer */
:root{
  color-scheme:dark;
  --bg:#13161b; --panel:#1d222a; --panel2:#262d37; --line:#343d4a;
  --fg:#f0ece4; --muted:#9aa3ad; --accent:#ffc244; --accent-ink:#2b1a00;
  --blue:#4a95ff; --red:#ff5b4f; --green:#8cc653; --inf:#6fa8ff; --cav:#c58cff; --arc:#7fd88a;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.topbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:10px 12px 8px}
.res{min-width:0;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.ico{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}
.view{flex:1;min-height:0;position:relative}
.scroll{height:100%;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box}
.scroll>*{flex-shrink:0}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:6px 0 0}
.sub{font-size:12px;color:var(--muted);line-height:1.55;margin:0}
#cityCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{border-radius:9px;padding:9px 10px;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px}
.btn.up{background:#1d3550;border-color:#2c5a86}
.btn.ok{background:#26391b;border-color:#3f6a2c}
.btn.gem{background:#3a2150;border-color:#6b3d93}
.btn:disabled{opacity:.45;cursor:default}
.btn-go{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;padding:11px;border-radius:10px;box-shadow:0 4px 0 #b47a10}
.btn-go:active{transform:translateY(2px);box-shadow:0 2px 0 #b47a10}
.btn-go:disabled{opacity:.5}
.cost{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.cost .no{color:var(--red)}
.bar{height:7px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
.muted{color:var(--muted)}
.t-inf{color:var(--inf)}.t-cav{color:var(--cav)}.t-arc{color:var(--arc)}

/* 건물 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:78%;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -10px 30px #0008;z-index:5}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.sheet .x{margin-left:auto;width:34px;height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:900}
.lv{font-size:12px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv b{font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}

/* 원정 */
.army{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.unit{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.unit canvas{width:52px;height:52px}
.unit b{font-variant-numeric:tabular-nums}
.unit small{font-size:11px;color:var(--muted)}
.vs{font-family:var(--f-display);font-size:15px;text-align:center;color:var(--muted)}
.slider{display:grid;grid-template-columns:52px 1fr 64px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.slider span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tip{font-size:12px;background:#2a2410;border:1px solid #5a4a1a;color:#ffe2a0;border-radius:8px;padding:8px 10px;line-height:1.5}

/* 영웅 */
.hero{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.portrait{width:72px;height:72px;border-radius:12px}
.tag{font-size:11px;font-weight:900;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px}

nav.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:9px 0 11px;font-weight:700;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button[aria-current="true"]{color:var(--fg)}
nav.tabs button[aria-current="true"] svg{color:var(--accent)}
nav.tabs svg{width:20px;height:20px}
.dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--red)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;white-space:nowrap}
#toast.on{opacity:1}

#battle{position:fixed;inset:0;background:#0d0b0a;z-index:20;display:flex;justify-content:center}
#bwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-stage{font-family:var(--f-display);font-size:18px;text-shadow:0 2px 0 #000;white-space:nowrap}
.prog{flex:1;height:8px;border-radius:4px;background:#0008;border:1px solid #fff3;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green)}
.prog.boss{height:12px}
.prog.boss i{background:var(--red)}
.hbtn{pointer-events:auto;min-width:36px;height:36px;border-radius:8px;background:#0008;border:1px solid #fff3;font-weight:900;padding:0 8px}
.bossrow{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;color:var(--red);text-shadow:0 2px 0 #000}
.buffs{display:flex;gap:6px;flex-wrap:wrap}
.buffs .chip{background:#000a;border-color:#fff3}
.hint{position:absolute;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;transition:opacity .6s}
.ovl{position:absolute;inset:0;background:#000b;display:grid;place-items:center;padding:16px}
.ovl .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovl h3{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0}
.ovl p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.rw{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:900;font-variant-numeric:tabular-nums;font-size:13px}
.ovl .row button{flex:1}
.btn2{border-radius:10px;padding:11px;font-weight:900;background:var(--panel2);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  </div>
</section>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const PI2=Math.PI*2;

const pw=(b,lv,k=1.5)=>Math.round(b*Math.pow(k,lv-1));

    g.fillStyle='#e9e4d8';for(const[a,b]of[[-8,-24],[8,-30],[-6,-34]]){g.beginPath();g.moveTo(a,b);g.lineTo(a+(a<0?-6:6),b-2);g.lineTo(a,b-5);g.fill()}}

  for(let i=0;i<120;i++){const x=R()*CW,y=R()*CH;g.fillStyle='rgba(90,60,30,.25)';g.fillRect(x,y,2,2)}

function enemyOf(st){
  const tot=Math.round(110*Math.pow(1.13,st-1)),p=PATTERNS[(st-1)%PATTERNS.length],L=1+.36*(st-1),boss=st%5===0;

}
function myLevels(){return{inf:S.b.barracks,cav:S.b.stable,arc:S.b.range}}
function myHb(){const o={inf:0,cav:0,arc:0};for(const id in S.heroes)o[HEROES[id].type]+=heroBuff(S.heroes[id].lv);return o}
function tstat(L,hb,t){const T=TROOP[t],m=tmul(L);return{atk:T.atk*m*(1+hb),ehp:T.hp*m*(1+T.def*m/60)*(1+hb*.6)}}

function roundKills(A,D){
  const k={inf:0,cav:0,arc:0},f=frontOf(D.n);if(!f)return k;
  for(const t of TT){const n=A.n[t];if(n<.5)continue;const a=tstat(A.L[t],A.hb[t],t).atk*n*.5;
    const hit=(tt,amt)=>{const cm=TROOP[t].beats===tt?1.5:TROOP[tt].beats===t?.8:1;k[tt]+=amt*cm/tstat(D.L[tt],D.hb[tt],tt).ehp};
    if(t==='cav'&&D.n.arc>=.5&&f!=='arc'){hit(f,a*.7);hit('arc',a*.3)}else hit(f,a)}
  for(const t of TT)k[t]=Math.min(k[t],D.n[t]);return k;
}
function simulate(me,en){
  const A={...me,n:{...me.n}},E={...en,n:{...en.n}},rounds=[];
  for(let r=0;r<10;r++){
    if(!frontOf(A.n)||!frontOf(E.n))break;
    const ka=roundKills(A,E),ke=roundKills(E,A);
    for(const t of TT){E.n[t]-=ka[t];A.n[t]-=ke[t]}
    rounds.push({me:{...A.n},en:{...E.n},ka,ke});
  }
  const win=!frontOf(E.n)||(frontOf(A.n)&&power(A)>power(E));
