<title>왕국 수비대</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen mobile app — resource bar, scrolling base/hero panel, tab bar; battles are a full-screen canvas layer */
:root{
  color-scheme:dark;
  --bg:#14110f; --panel:#1f1a16; --panel2:#2a231d; --line:#3a3129;
  --fg:#f1ebe2; --muted:#a39685; --accent:#ffbf3c; --accent-ink:#2b1a00;
  --blue:#4aa3ff; --red:#ff5b4f; --green:#8cc653; --purple:#a66bff;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

.topbar{display:flex;gap:8px;padding:10px 16px 8px}
.res{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.ico{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}

main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em;margin:6px 0 0}

.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{position:relative;overflow:hidden;border-radius:12px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.op.run{background:linear-gradient(160deg,#21324a,#1a1f2a)}
.op.def{background:linear-gradient(160deg,#3d2b14,#221a12)}
.op.hero{grid-column:1/-1;background:linear-gradient(160deg,#2a1d48,#191428)}
.op .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.op .stg{font-family:var(--f-display);font-size:30px;line-height:1}
.op .sub{font-size:12px;color:var(--muted);line-height:1.5;min-height:3em}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-go{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;padding:10px;border-radius:10px;box-shadow:0 4px 0 #b47a10}
.btn-go:active{transform:translateY(2px);box-shadow:0 2px 0 #b47a10}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.card .nm{font-family:var(--f-display);font-size:17px}
.lv{font-size:12px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.desc{font-size:12px;color:var(--muted);min-height:2.6em}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
.btn{border-radius:8px;padding:7px 8px;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.up{background:#1d3550;border-color:#2c5a86}
.btn.collect{background:#26391b;border-color:#3f6a2c}
.btn:disabled{opacity:.45;cursor:default}
.cost{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.cost .no{color:var(--red)}
.maxed{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}

.hero{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.portrait{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:#14181b}
.hero .role{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts .btn{flex:1;min-width:110px}
.tag{font-size:11px;font-weight:900;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px}
.reset{align-self:center;font-size:12px;color:var(--muted);text-decoration:underline;padding:8px}

nav.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:10px 0 12px;font-weight:700;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="true"]{color:var(--fg)}
nav.tabs button[aria-current="true"] svg{color:var(--accent)}
nav.tabs svg{width:20px;height:20px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;white-space:nowrap}
#toast.on{opacity:1}

#battle{position:fixed;inset:0;background:#0d0b0a;z-index:20;display:flex;justify-content:center}
#bwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;touch-action:none}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-stage{font-family:var(--f-display);font-size:18px;text-shadow:0 2px 0 #000;white-space:nowrap}
.prog{flex:1;height:8px;border-radius:4px;background:#0008;border:1px solid #fff3;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.prog.hp i{background:var(--green)}
.prog.boss{height:12px}
.prog.boss i{background:var(--red)}
#bPause{pointer-events:auto;width:36px;height:36px;border-radius:8px;background:#0008;border:1px solid #fff3;font-weight:900}
.bossrow{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;color:var(--red);text-shadow:0 2px 0 #000}
.buffs{display:flex;gap:6px;flex-wrap:wrap}
.buffs .chip{background:#000a;border-color:#fff3}
.hint{position:absolute;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;transition:opacity .6s}
.ovl{position:absolute;inset:0;background:#000b;display:grid;place-items:center;padding:16px}
.ovl .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovl h3{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0}
.ovl p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.rw{display:flex;justify-content:center;gap:14px;font-weight:900;font-variant-numeric:tabular-nums}
.ovl .row{display:flex;gap:8px}
.ovl .row button{flex:1}
.btn2{border-radius:10px;padding:11px;font-weight:900;background:var(--panel2);border:1px solid var(--line)}
.skills{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:12px;pointer-events:none}
.sk{pointer-events:auto;position:relative;width:66px;height:66px;border-radius:50%;border:3px solid var(--c);background:radial-gradient(circle at 35% 30%,#3a4250,#12151a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#fff;box-shadow:0 4px 0 #0008;touch-action:manipulation}
.sk.ready{box-shadow:0 0 14px var(--c),0 4px 0 #0008}
.sk .ic{width:28px;height:28px;display:block}
.sk .ic svg{width:100%;height:100%}
.sk .nm{font-family:var(--f-display);font-size:12px;text-shadow:0 1px 2px #000}
.sk .cdv{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;text-shadow:0 2px 3px #000;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="topbar">
    <div class="res"><span class="ico" data-ico="food"></span><span id="rFood">0</span></div>
    <div class="res"><span class="ico" data-ico="iron"></span><span id="rIron">0</span></div>
    <div class="res"><span class="ico" data-ico="gold"></span><span id="rGold">0</span></div>
  </div>
  <main id="pBase"></main>
  <main id="pHero" hidden></main>
  <nav class="tabs">
    <button id="tBase" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>기지</button>
    <button id="tRun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21L19 3M14 3h5v5"/><path d="M5 14l5 5"/></svg>돌격전</button>
    <button id="tDef"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>방어전</button>
    <button id="tHer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h7l-2 8 9-12h-7z"/></svg>결전</button>
    <button id="tHero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>영웅</button>
  </nav>
</div>

<section id="battle" hidden>
  <div id="bwrap">
    <canvas id="gl" hidden></canvas>
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-top"><span class="hud-stage" id="hStage">STAGE 1</span><div class="prog" id="hProgBox"><i id="hProg"></i></div><button id="bPause" aria-label="일시정지">II</button></div>
      <div class="bossrow" id="hBossRow" hidden><span>보스</span><div class="prog boss"><i id="hBoss"></i></div></div>
      <div class="buffs" id="hBuffs"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="skills" id="skills" hidden></div>
    <div class="ovl" id="ovl" hidden><div class="box" id="ovlBox"></div></div>
  </div>
</section>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='zombie-squad-v1';
const ICONS={
  food:'<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5c3.2 2.2 4.4 5 4.4 7.8a4.4 4.4 0 0 1-8.8 0C3.6 6.5 4.8 3.7 8 1.5z" fill="#9bd16a"/><path d="M8 5v9" stroke="#4d7a2c" stroke-width="1.4"/></svg>',
  iron:'<svg class="ico" viewBox="0 0 16 16"><path d="M8 1l6 3.5v7L8 15l-6-3.5v-7z" fill="#aab6c1"/><path d="M8 1v14M2 4.5l12 7" stroke="#6c7883" stroke-width="1"/></svg>',
  gold:'<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#ffc93c" stroke="#b9860b" stroke-width="1.5"/><path d="M8 4.5v7" stroke="#b9860b" stroke-width="1.5"/></svg>'
};
document.querySelectorAll('[data-ico]').forEach(e=>e.outerHTML=ICONS[e.dataset.ico]);
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1)+'B';if(a>=1e6)return(n/1e6).toFixed(1)+'M';if(a>=1e4)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('ko-KR')};
const pw=(b,lv,k=1.5)=>Math.round(b*Math.pow(k,lv-1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const PI2=Math.PI*2;

/* ---------- 난이도 (봇 시뮬레이션으로 맞춘 값) ---------- */
const TUNE={
  hero:{par:.8,m:1.04,e0:.5,eSt:.14,heroHp:420,unitHp:120,heroAtk:3.2,unitAtk:1,bolt:22,fire:34,rain:40,g0:18,gD:3.5,gW:10,oW:1.2,oD:.4,gap:.35,barrel:150,
    gob:{hp:190,spd:2,atk:14,r:.3},orc:{hp:880,spd:1.4,atk:45,r:.45},boss:{hp:17500,spd:.85,atk:160,r:1.2}},
  run:{wpnT:.9,shootCap:8,bossSpd:2,par:.86,gateSc:.07,t0:3.6,tSt:.28,tMax:7.7,f0:.35,fSt:.02,fMax:.7,a0:.3,aSt:.025,aMax:.75,b0:9,bSt:.5,bMax:22,drain:.08,barrelAmt:.15,barrelT:.5,kingAmt:.3,kingT:1.1},
  def:{par:.8,m:1.04,castle:10,start:15,startD:5,heroMul:1.3,raven:3,blaze:2.2,tower:34,towerGrow:1.01,g0:8,gW:3.5,gD:1,oW:1.2,oD:.35,gap:.5,
    gob:{hp:95,spd:2,dmg:1,coins:1,r:.26},orc:{hp:400,spd:1.4,dmg:2,coins:3,r:.36},ogre:{hp:3800,spd:.9,dmg:6,coins:12,r:.75}}
};

/* ---------- 저장 데이터 ---------- */
const def=()=>({res:{food:800,iron:800,gold:400},b:{hq:1,farm:1,mine:1,goldmine:1,barracks:1,armory:1,range:1,depot:1},store:{farm:0,mine:0,goldmine:0},stage:1,dstage:1,hstage:1,heroes:{raven:1},hero:'raven',last:Date.now()});
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t),d=def();return{...d,...o,res:{...d.res,...o.res},b:{...d.b,...o.b},store:{...d.store,...o.store},heroes:{...d.heroes,...o.heroes}}}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- 건물 ---------- */
const RATE={farm:lv=>Math.round(300*lv*Math.pow(1.1,lv-1)),mine:lv=>Math.round(240*lv*Math.pow(1.1,lv-1)),goldmine:lv=>Math.round(120*lv*Math.pow(1.1,lv-1))};
const PROD={farm:'food',mine:'iron',goldmine:'gold'};
const ST={
  men:()=>S.b.barracks,
  dmg:(lv=S.b.armory)=>10*(1+.15*(lv-1)),
  rate:(lv=S.b.range)=>1+.08*(lv-1),
  cap:(lv=S.b.depot)=>4+2*(lv-1)
};
const BLD=[
  {id:'hq',nm:'성채',desc:lv=>`다른 건물 최대 Lv.${lv}`,cost:lv=>({gold:pw(150,lv,1.55),iron:pw(300,lv,1.55)})},
  {id:'farm',nm:'농장',desc:lv=>`식량 ${fmt(RATE.farm(lv))} / 시간`,cost:lv=>({iron:pw(150,lv),gold:pw(50,lv)})},
  {id:'mine',nm:'철광산',desc:lv=>`철 ${fmt(RATE.mine(lv))} / 시간`,cost:lv=>({food:pw(180,lv),gold:pw(50,lv)})},
  {id:'goldmine',nm:'금광',desc:lv=>`금 ${fmt(RATE.goldmine(lv))} / 시간`,cost:lv=>({food:pw(200,lv),iron:pw(200,lv)})},
  {id:'barracks',nm:'병영',desc:lv=>`돌격전 시작 병사 ${lv}명`,cost:lv=>({food:pw(250,lv),iron:pw(150,lv)})},
  {id:'armory',nm:'대장간',desc:lv=>`공격력 ${ST.dmg(lv).toFixed(1)}`,cost:lv=>({iron:pw(300,lv),gold:pw(100,lv)})},
  {id:'range',nm:'궁술장',desc:lv=>`공격 속도 ×${ST.rate(lv).toFixed(2)}`,cost:lv=>({food:pw(250,lv),gold:pw(120,lv)})},
  {id:'depot',nm:'창고',desc:lv=>`생산품 ${ST.cap(lv)}시간치 보관`,cost:lv=>({food:pw(200,lv),iron:pw(200,lv)})}
];
const HQMAX=30;

/* ---------- 영웅 ---------- */
const HEROES={
  raven:{nm:'레이븐',role:'석궁수',col:'#ffd166',tab:['#ffd45a','#c98a12'],ch:'R',unlock:null,
    pow:lv=>Math.round(60*lv*Math.pow(1.1,lv-1)),desc:lv=>`1.2초마다 강한 화살 한 발 · 돌격전 ${fmt(HEROES.raven.pow(lv))} 피해, 방어전 공격력의 3배`},
  blaze:{nm:'블레이즈',role:'화염 마법사',col:'#ff8a3d',tab:['#ff9a4a','#c4521a'],ch:'B',unlock:{gold:1500,iron:1500},
    pow:lv=>Math.round(40*lv*Math.pow(1.1,lv-1)),desc:lv=>`2.5초마다 화염구로 주변 적 모두 공격 · 돌격전 ${fmt(HEROES.blaze.pow(lv))} 피해, 방어전 공격력의 2.2배`},
  hanna:{nm:'한나',role:'성직자',col:'#7fe0c4',tab:['#8ff0d2','#2f9a7c'],ch:'H',unlock:{gold:2500,food:3000},
    pow:lv=>Math.ceil(lv/2),desc:lv=>`돌격전: 2초마다 병사 ${HEROES.hanna.pow(lv)}명 복귀 · 방어전: 6초마다 성벽 ${HEROES.hanna.pow(lv)} 회복`}
};
const heroCost=lv=>({food:pw(250,lv,1.45),iron:pw(120,lv,1.45)});
const heroMax=()=>S.b.hq*2;

/* ---------- 자원 ---------- */
const canPay=c=>Object.entries(c).every(([k,v])=>S.res[k]>=v);
const pay=c=>{for(const[k,v]of Object.entries(c))S.res[k]-=v};
const costHTML=c=>`<span class="cost">${Object.entries(c).map(([k,v])=>`<span class="${S.res[k]>=v?'':'no'}">${ICONS[k]} ${fmt(v)}</span>`).join('')}</span>`;
function accrue(){
  const now=Date.now(),h=Math.max(0,(now-S.last)/36e5);S.last=now;
  for(const id in PROD){const r=RATE[id](S.b[id]);S.store[id]=Math.min(r*ST.cap(),S.store[id]+r*h)}
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function paintRes(){$('#rFood').textContent=fmt(S.res.food);$('#rIron').textContent=fmt(S.res.iron);$('#rGold').textContent=fmt(S.res.gold)}

/* ---------- 기지 화면 ---------- */
const power=()=>Math.round(ST.men()*ST.dmg()*ST.rate()*12+HEROES[S.hero].pow(S.heroes[S.hero])*(S.hero==='hanna'?60:2));
function renderBase(){
  const h=HEROES[S.hero];
  $('#pBase').innerHTML=`
  <div class="stats"><span class="chip">전투력 ${fmt(power())}</span><span class="chip">공격력 ${ST.dmg().toFixed(1)}</span><span class="chip">공격 속도 ×${ST.rate().toFixed(2)}</span><span class="chip">영웅 ${h.nm} Lv.${S.heroes[S.hero]}</span></div>
  <section class="ops">
    <div class="op run"><span class="eyebrow">돌격전</span><span class="stg">STAGE ${S.stage}</span>
      <span class="sub">게이트로 기사단을 불리고 술통을 부숴 고블린 군단과 오우거를 쓰러뜨리세요.</span>
      <button class="btn-go" data-act="run">출전</button></div>
    <div class="op def"><span class="eyebrow">성 방어전</span><span class="stg">STAGE ${S.dstage}</span>

function card(b){

function tickBase(){
  for(const id in PROD){

   성 방어전 — 넓은 맵, 카메라가 영웅을 따라감

const MAP={w:18,h:32,
  path:[[2.2,33.5],[2.2,28.5],[6.5,25.8],[12,26.6],[15.4,23.6],[14.6,19.6],[9.6,18.6],[5.2,16.4],[3.8,12.4],[7.4,10],[12.4,10.8],[15.2,8],[12.6,5.2],[9,5],[9,3.4]],
  castle:[9,2.9]};
(()=>{const P=MAP.path;MAP.seg=[];let L=0;for(let i=0;i<P.length-1;i++){const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);MAP.seg.push({a:P[i],b:P[i+1],L0:L,d});L+=d}MAP.len=L})();
function pathAt(dist){
  for(const s of MAP.seg)if(dist<=s.L0+s.d){const t=(dist-s.L0)/s.d,dx=(s.b[0]-s.a[0])/s.d,dy=(s.b[1]-s.a[1])/s.d;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,nx:-dy,ny:dx}}
  const s=MAP.seg[MAP.seg.length-1];return{x:s.b[0],y:s.b[1],nx:0,ny:0};
}
function distPath(x,y){let m=1e9;for(const s of MAP.seg){const vx=s.b[0]-s.a[0],vy=s.b[1]-s.a[1],t=clamp(((x-s.a[0])*vx+(y-s.a[1])*vy)/(vx*vx+vy*vy),0,1);m=Math.min(m,Math.hypot(x-s.a[0]-vx*t,y-s.a[1]-vy*t))}return m}
MAP.pads=(()=>{
  const pads=[];let side=1;
  for(let d=5;d<MAP.len-3;d+=3.6){
    for(const sg of[side,-side]){const p=pathAt(d),x=p.x+p.nx*2*sg,y=p.y+p.ny*2*sg;
      if(x<1.2||x>MAP.w-1.2||y<4||y>MAP.h-1.5)continue;if(distPath(x,y)<1.75)continue;
      if(pads.some(q=>Math.hypot(q.x-x,q.y-y)<2.6))continue;if(Math.hypot(x-MAP.castle[0],y-MAP.castle[1])<3.4)continue;
      pads.push({x,y,d});break}

  }
  pads.sort((a,b)=>b.d-a.d);
  const costs=[15,15,20,20,25,25,30,30,35,40,45,50,55,60,70,80];
  pads.forEach((p,i)=>p.cost=costs[Math.min(i,costs.length-1)]);
  return pads;
})();
let DS=40,PS=40,mapCv=null,camX=0,camY=0;

function buildMap(ps){
  const m=document.createElement('canvas');m.width=Math.ceil(MAP.w*ps);m.height=Math.ceil(MAP.h*ps);
  const g=m.getContext('2d');g.scale(ps,ps);g.lineJoin='round';g.lineCap='round';
  const R=rng(77);
  // 동굴 바닥
  g.fillStyle='#2a201a';g.fillRect(0,0,MAP.w,MAP.h);
  for(let i=0;i<900;i++){const x=R()*MAP.w,y=R()*MAP.h,r=.05+R()*.25;g.fillStyle=R()<.5?'rgba(0,0,0,.18)':'rgba(120,95,70,.10)';g.beginPath();g.ellipse(x,y,r,r*.7,R()*3,0,PI2);g.fill()}
  // 큰 바위
  for(let i=0;i<46;i++){const x=R()*MAP.w,y=R()*MAP.h,r=.6+R()*1.3;if(distPath(x,y)<r+1.6||Math.hypot(x-MAP.castle[0],y-MAP.castle[1])<5)continue;

  // 성 앞 광장

  g.fillStyle='#3a2c20';g.beginPath();g.ellipse(cx0,cy0+1.4,4.4,3.3,0,0,PI2);g.fill();
  g.fillStyle='#d4b07c';g.beginPath();g.ellipse(cx0,cy0+1.4,4.1,3.0,0,0,PI2);g.fill();
  // 길 (넓은 판석 계단)

  stroke(2.7,'#3a2c20');stroke(2.35,'#bf9864');
  for(let d=0;d<MAP.len;d+=.55){const p=pathAt(d),q=pathAt(d+.55),hw=1.12;
    const sh=hash(Math.round(d*10))*.12;
    g.fillStyle=`rgb(${214-sh*200|0},${180-sh*200|0},${128-sh*180|0})`;
    g.beginPath();g.moveTo(p.x+p.nx*hw,p.y+p.ny*hw);g.lineTo(p.x-p.nx*hw,p.y-p.ny*hw);g.lineTo(q.x-q.nx*hw,q.y-q.ny*hw);g.lineTo(q.x+q.nx*hw,q.y+q.ny*hw);g.closePath();g.fill();
    g.strokeStyle='rgba(90,60,30,.55)';g.lineWidth=.06;g.beginPath();g.moveTo(q.x+q.nx*hw,q.y+q.ny*hw);g.lineTo(q.x-q.nx*hw,q.y-q.ny*hw);g.stroke();
    g.strokeStyle='rgba(255,240,210,.18)';g.lineWidth=.05;g.beginPath();g.moveTo(p.x+p.nx*hw,p.y+p.ny*hw+.05);g.lineTo(p.x-p.nx*hw,p.y-p.ny*hw+.05);g.stroke();
    if(hash(Math.round(d*7))<.5){g.strokeStyle='rgba(90,60,30,.35)';g.beginPath();g.moveTo((p.x+q.x)/2,(p.y+q.y)/2);g.lineTo((p.x+q.x)/2+p.nx*.4,(p.y+q.y)/2+p.ny*.4);g.stroke()}}

    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(q.x+.1,q.y+.15,r*1.05,r*.6,0,0,PI2);g.fill();
    g.fillStyle='#4f463e';g.beginPath();for(let k=0;k<6;k++){const a=k/6*PI2+.5;g.lineTo(q.x+Math.cos(a)*r,q.y+Math.sin(a)*r*.6)}g.lineTo(q.x+Math.cos(.5)*r,q.y-h+Math.sin(.5)*r*.6);g.closePath();
    g.fillRect(q.x-r,q.y-h,r*2,h);
    const tg=g.createLinearGradient(q.x-r,0,q.x+r,0);tg.addColorStop(0,'#5d544b');tg.addColorStop(1,'#3a332c');g.fillStyle=tg;g.fillRect(q.x-r*.87,q.y-h,r*1.74,h+r*.3);
    g.fillStyle='#8b8176';g.beginPath();for(let k=0;k<6;k++){const a=k/6*PI2+.5;g.lineTo(q.x+Math.cos(a)*r,q.y-h+Math.sin(a)*r*.6)}g.closePath();g.fill();g.lineWidth=.04;g.strokeStyle='#1e1915';g.stroke()}

    g.beginPath();g.moveTo(a.x,a.y-.4);g.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2,b.x,b.y-.4);g.stroke();

    if(R()<.06){g.fillStyle=['#52e07a','#5aa0ff','#ff5a7a','#c08bff'][Math.floor(R()*4)];g.beginPath();g.moveTo(x,y-.25);g.lineTo(x+.14,y-.05);g.lineTo(x,y+.1);g.lineTo(x-.14,y-.05);g.fill()}}

const g3W=x=>-x;
function g3begin(){for(const p of[...G3.knight,...G3.gob,...G3.orc])p.mesh.count=0;G3.shot.count=0;G3.part.count=0;G3.fball.count=0;G3.bolt.count=0}

function g3rig(rig,x,y,z,yaw,scale,phase,tint){
  const T=G3.T,fm=G3.tmp2||(G3.tmp2=new T.Matrix4()),lm=G3.tmp3||(G3.tmp3=new T.Matrix4());
  G3.q.setFromEuler(G3.e.set(0,yaw,0));fm.compose(G3.v.set(x,y,z),G3.q,G3.s.set(scale,scale,scale));
  for(const p of rig){const m=p.mesh;if(m.count>=m.instanceMatrix.count)continue;
    let L=p.local;

}

    if(f.type==='boom'&&!f.g3){f.g3=1;g3flash(f.x,.6,f.z,f.r*.9,0xff8a3d,.5);g3ring(f.x,f.z,f.r*1.2,0xffb050,.5);B.shake3=.35}
    if(f.type==='rain'&&!f.g3){f.g3=1;g3ring(f.x,f.z,2.7,0xffd166,1.1)}
    if(f.type==='heal'&&!f.g3){f.g3=1;for(const u of B.units)if(u.hp>0)g3flash(sx+u.ox,.6,u.oz,.45,0x7ff0c0,.8)}}
  g3partsAndShots();g3end();g3sweep();g3render();
  c.clearRect(0,0,VW,VH);
  for(const u of B.units){if(u.hp<=0)continue;const p=g3proj(sx+u.ox,u.hero?1.75:1.12,u.oz);if(!p)continue;const w=p.s*(u.hero?.75:.45),h=u.hero?6:4;
    c.fillStyle='#000b';c.fillRect(p.x-w/2-1,p.y-1,w+2,h+2);c.fillStyle=u.hp/u.mhp>.35?'#5dd35a':'#ff5b4f';c.fillRect(p.x-w/2,p.y,w*u.hp/u.mhp,h)}
  for(const e of B.ents){if(e.dead)continue;
    if(e.t==='e'&&e.k==='boss'){const p=g3proj(e.x,e.sz*1.5,e.z);if(p){const px=clamp(p.s*.9,18,60);outlined(fmt(Math.max(0,Math.ceil(e.hp))),p.x,p.y-px*.4,px,'#ff5b4f','#1a0505');const w=px*3;c.fillStyle='#000a';c.fillRect(p.x-w/2,p.y+px*.25,w,7);c.fillStyle='#ffcf3a';c.fillRect(p.x-w/2,p.y+px*.25,w*clamp(e.hp/e.mhp,0,1),7)}}
    else if(e.t==='e'&&e.k==='orc'&&e.hp<e.mhp){const p=g3proj(e.x,1.5,e.z);if(p){const w=p.s*.8;c.fillStyle='#000a';c.fillRect(p.x-w/2,p.y,w,4);c.fillStyle='#ff5b4f';c.fillRect(p.x-w/2,p.y,w*e.hp/e.mhp,4)}}
    else if(e.t==='c'){const p=g3proj(e.x,e.kind==='cd'?2.05:1.75,e.z);if(p&&p.s>3){outlined(fmt(Math.ceil(e.hp)),p.x,p.y,clamp(p.s*.5,10,40),'#fff');if(p.s>12)outlined(e.kind==='men'?'기사 +3':'스킬 충전',p.x,p.y-p.s*.45,clamp(p.s*.3,9,22),'#ffd166')}}}
  for(const f of B.floats){const p=g3proj(f.x,f.h,f.z);if(!p)continue;c.globalAlpha=clamp(f.life*1.5,0,1);outlined(f.text,p.x,p.y,clamp(p.s*.5,16,44),f.col,'#000')}
  c.globalAlpha=1;
  if(B.banner){c.globalAlpha=clamp(B.banner.life*1.5,0,1);outlined(B.banner.text,VW/2,VH*.3,Math.min(46,VW*.11),B.banner.col,'#000');c.globalAlpha=1}
}
/* ---------- 3D 모드 켜고 끄기 ---------- */
let g3last=0;
function g3reset(){if(!G3.r)return;for(const[,o]of G3.objs)G3.scene.remove(o);G3.objs.clear();for(const f of G3.fx)G3.scene.remove(f.m);G3.fx=[]}
function g3attach(draw){
  if(!g3init())return false;
  g3reset();B.g3=true;$('#gl').hidden=false;
  const base=B.layout;B.layout=()=>{base&&base();g3size()};B.layout();
  B.draw=()=>{const now=performance.now(),dt=Math.min(.05,(now-(g3last||now))/1000);g3last=now;B.shake3=Math.max(0,(B.shake3||0)-dt*1.5);g3fxUpdate(dt);draw()};
  return true;
}
