<title>왕국 수비대</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* Layout: one-screen mobile app — resource bar, scrolling base/hero panel, tab bar; battles are a full-screen canvas layer */
:root{
  color-scheme:dark;
  --bg:#14110f; --panel:#1f1a16; --panel2:#2a231d; --line:#3a3129;
  --fg:#f1ebe2; --muted:#a39685; --accent:#ffbf3c; --accent-ink:#2b1a00;
  --blue:#4aa3ff; --red:#ff5b4f; --green:#8cc653; --purple:#a66bff;
  --f-display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

.topbar{display:flex;gap:8px;padding:10px 16px 8px}
.res{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.ico{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}

main{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}
main>*{flex-shrink:0}
h2{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em;margin:6px 0 0}

.ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{position:relative;overflow:hidden;border-radius:12px;padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.op.run{background:linear-gradient(160deg,#21324a,#1a1f2a)}
.op.def{background:linear-gradient(160deg,#3d2b14,#221a12)}
.op .eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700}
.op .stg{font-family:var(--f-display);font-size:30px;line-height:1}
.op .sub{font-size:12px;color:var(--muted);line-height:1.5;min-height:3em}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn-go{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:20px;padding:10px;border-radius:10px;box-shadow:0 4px 0 #b47a10}
.btn-go:active{transform:translateY(2px);box-shadow:0 2px 0 #b47a10}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
.card .nm{font-family:var(--f-display);font-size:17px}
.lv{font-size:12px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.desc{font-size:12px;color:var(--muted);min-height:2.6em}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}
.btn{border-radius:8px;padding:7px 8px;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.btn.up{background:#1d3550;border-color:#2c5a86}
.btn.collect{background:#26391b;border-color:#3f6a2c}
.btn:disabled{opacity:.45;cursor:default}
.cost{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.cost .no{color:var(--red)}
.maxed{font-size:12px;color:var(--muted);text-align:center;padding:8px 0}

.hero{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.portrait{width:64px;height:64px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:#14181b}
.hero .role{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.hero .acts .btn{flex:1;min-width:110px}
.tag{font-size:11px;font-weight:900;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 6px;margin-left:6px}
.reset{align-self:center;font-size:12px;color:var(--muted);text-decoration:underline;padding:8px}

nav.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;padding:10px 0 12px;font-weight:700;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="true"]{color:var(--fg)}
nav.tabs button[aria-current="true"] svg{color:var(--accent)}
nav.tabs svg{width:20px;height:20px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;white-space:nowrap}
#toast.on{opacity:1}

#battle{position:fixed;inset:0;background:#0d0b0a;z-index:20;display:flex;justify-content:center}
#bwrap{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud-top{display:flex;align-items:center;gap:10px}
.hud-stage{font-family:var(--f-display);font-size:18px;text-shadow:0 2px 0 #000;white-space:nowrap}
.prog{flex:1;height:8px;border-radius:4px;background:#0008;border:1px solid #fff3;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.prog.hp i{background:var(--green)}
.prog.boss{height:12px}
.prog.boss i{background:var(--red)}
#bPause{pointer-events:auto;width:36px;height:36px;border-radius:8px;background:#0008;border:1px solid #fff3;font-weight:900}
.bossrow{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:14px;color:var(--red);text-shadow:0 2px 0 #000}
.buffs{display:flex;gap:6px;flex-wrap:wrap}
.buffs .chip{background:#000a;border-color:#fff3}
.hint{position:absolute;left:16px;right:16px;bottom:calc(28px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:700;font-size:14px;color:#fff;text-shadow:0 2px 4px #000;pointer-events:none;transition:opacity .6s}
.ovl{position:absolute;inset:0;background:#000b;display:grid;place-items:center;padding:16px}
.ovl .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.ovl h3{font-family:var(--f-display);font-weight:400;font-size:32px;margin:0}
.ovl p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.rw{display:flex;justify-content:center;gap:14px;font-weight:900;font-variant-numeric:tabular-nums}
.ovl .row{display:flex;gap:8px}
.ovl .row button{flex:1}
.btn2{border-radius:10px;padding:11px;font-weight:900;background:var(--panel2);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="topbar">
    <div class="res"><span class="ico" data-ico="food"></span><span id="rFood">0</span></div>
    <div class="res"><span class="ico" data-ico="iron"></span><span id="rIron">0</span></div>
    <div class="res"><span class="ico" data-ico="gold"></span><span id="rGold">0</span></div>
  </div>
  <main id="pBase"></main>
  <main id="pHero" hidden></main>
  <nav class="tabs">
    <button id="tBase" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>기지</button>
    <button id="tRun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 21L19 3M14 3h5v5"/><path d="M5 14l5 5"/></svg>돌격전</button>
    <button id="tDef"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>방어전</button>
    <button id="tHero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>영웅</button>
  </nav>
</div>

<section id="battle" hidden>
  <div id="bwrap">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hud-top"><span class="hud-stage" id="hStage">STAGE 1</span><div class="prog" id="hProgBox"><i id="hProg"></i></div><button id="bPause" aria-label="일시정지">II</button></div>
      <div class="bossrow" id="hBossRow" hidden><span>보스</span><div class="prog boss"><i id="hBoss"></i></div></div>
      <div class="buffs" id="hBuffs"></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="ovl" id="ovl" hidden><div class="box" id="ovlBox"></div></div>
  </div>
</section>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const KEY='zombie-squad-v1';
const ICONS={
  food:'<svg class="ico" viewBox="0 0 16 16"><path d="M8 1.5c3.2 2.2 4.4 5 4.4 7.8a4.4 4.4 0 0 1-8.8 0C3.6 6.5 4.8 3.7 8 1.5z" fill="#9bd16a"/><path d="M8 5v9" stroke="#4d7a2c" stroke-width="1.4"/></svg>',
  iron:'<svg class="ico" viewBox="0 0 16 16"><path d="M8 1l6 3.5v7L8 15l-6-3.5v-7z" fill="#aab6c1"/><path d="M8 1v14M2 4.5l12 7" stroke="#6c7883" stroke-width="1"/></svg>',
  gold:'<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#ffc93c" stroke="#b9860b" stroke-width="1.5"/><path d="M8 4.5v7" stroke="#b9860b" stroke-width="1.5"/></svg>'
};
document.querySelectorAll('[data-ico]').forEach(e=>e.outerHTML=ICONS[e.dataset.ico]);
const fmt=n=>{n=Math.floor(n);const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1)+'B';if(a>=1e6)return(n/1e6).toFixed(1)+'M';if(a>=1e4)return(n/1e3).toFixed(1)+'K';return n.toLocaleString('ko-KR')};
const pw=(b,lv,k=1.5)=>Math.round(b*Math.pow(k,lv-1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- 저장 데이터 ---------- */
const def=()=>({res:{food:800,iron:800,gold:400},b:{hq:1,farm:1,mine:1,goldmine:1,barracks:1,armory:1,range:1,depot:1},store:{farm:0,mine:0,goldmine:0},stage:1,dstage:1,heroes:{raven:1},hero:'raven',last:Date.now()});
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t),d=def();return{...d,...o,res:{...d.res,...o.res},b:{...d.b,...o.b},store:{...d.store,...o.store},heroes:{...d.heroes,...o.heroes}}}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- 건물 ---------- */
const RATE={farm:lv=>Math.round(300*lv*Math.pow(1.1,lv-1)),mine:lv=>Math.round(240*lv*Math.pow(1.1,lv-1)),goldmine:lv=>Math.round(120*lv*Math.pow(1.1,lv-1))};
const PROD={farm:'food',mine:'iron',goldmine:'gold'};
const ST={
  men:()=>S.b.barracks,
  dmg:(lv=S.b.armory)=>10*(1+.15*(lv-1)),
  rate:(lv=S.b.range)=>1+.08*(lv-1),
  cap:(lv=S.b.depot)=>4+2*(lv-1)
};
const BLD=[
  {id:'hq',nm:'성채',desc:lv=>`다른 건물 최대 Lv.${lv}`,cost:lv=>({gold:pw(150,lv,1.55),iron:pw(300,lv,1.55)})},
  {id:'farm',nm:'농장',desc:lv=>`식량 ${fmt(RATE.farm(lv))} / 시간`,cost:lv=>({iron:pw(150,lv),gold:pw(50,lv)})},
  {id:'mine',nm:'철광산',desc:lv=>`철 ${fmt(RATE.mine(lv))} / 시간`,cost:lv=>({food:pw(180,lv),gold:pw(50,lv)})},
  {id:'goldmine',nm:'금광',desc:lv=>`금 ${fmt(RATE.goldmine(lv))} / 시간`,cost:lv=>({food:pw(200,lv),iron:pw(200,lv)})},
  {id:'barracks',nm:'병영',desc:lv=>`돌격전 시작 병사 ${lv}명`,cost:lv=>({food:pw(250,lv),iron:pw(150,lv)})},
  {id:'armory',nm:'대장간',desc:lv=>`공격력 ${ST.dmg(lv).toFixed(1)}`,cost:lv=>({iron:pw(300,lv),gold:pw(100,lv)})},
  {id:'range',nm:'궁술장',desc:lv=>`공격 속도 ×${ST.rate(lv).toFixed(2)}`,cost:lv=>({food:pw(250,lv),gold:pw(120,lv)})},
  {id:'depot',nm:'창고',desc:lv=>`생산품 ${ST.cap(lv)}시간치 보관`,cost:lv=>({food:pw(200,lv),iron:pw(200,lv)})}
];
const HQMAX=30;

/* ---------- 영웅 ---------- */
const HEROES={
  raven:{nm:'레이븐',role:'궁수',col:'#ffd166',ch:'R',unlock:null,
    pow:lv=>Math.round(60*lv*Math.pow(1.1,lv-1)),desc:lv=>`1.2초마다 가장 가까운 적에게 ${fmt(HEROES.raven.pow(lv))} 피해`},
  blaze:{nm:'블레이즈',role:'화염 마법사',col:'#ff8a3d',ch:'B',unlock:{gold:1500,iron:1500},
    pow:lv=>Math.round(40*lv*Math.pow(1.1,lv-1)),desc:lv=>`2.5초마다 화염구로 주변 적 모두에게 ${fmt(HEROES.blaze.pow(lv))} 피해`},
  hanna:{nm:'한나',role:'성직자',col:'#7fe0c4',ch:'H',unlock:{gold:2500,food:3000},
    pow:lv=>Math.ceil(lv/2),desc:lv=>`돌격전: 2초마다 병사 ${HEROES.hanna.pow(lv)}명 복귀 · 방어전: 6초마다 성벽 ${HEROES.hanna.pow(lv)} 회복`}
};
const heroCost=lv=>({food:pw(250,lv,1.45),iron:pw(120,lv,1.45)});
const heroMax=()=>S.b.hq*2;

/* ---------- 자원 ---------- */
const canPay=c=>Object.entries(c).every(([k,v])=>S.res[k]>=v);
const pay=c=>{for(const[k,v]of Object.entries(c))S.res[k]-=v};
const costHTML=c=>`<span class="cost">${Object.entries(c).map(([k,v])=>`<span class="${S.res[k]>=v?'':'no'}">${ICONS[k]} ${fmt(v)}</span>`).join('')}</span>`;
function accrue(){
  const now=Date.now(),h=Math.max(0,(now-S.last)/36e5);S.last=now;
  for(const id in PROD){const r=RATE[id](S.b[id]);S.store[id]=Math.min(r*ST.cap(),S.store[id]+r*h)}
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function paintRes(){$('#rFood').textContent=fmt(S.res.food);$('#rIron').textContent=fmt(S.res.iron);$('#rGold').textContent=fmt(S.res.gold)}

/* ---------- 기지 화면 ---------- */
const power=()=>Math.round(ST.men()*ST.dmg()*ST.rate()*12+HEROES[S.hero].pow(S.heroes[S.hero])*(S.hero==='hanna'?60:2));
function renderBase(){
  const h=HEROES[S.hero];
  $('#pBase').innerHTML=`
  <div class="stats"><span class="chip">전투력 ${fmt(power())}</span><span class="chip">공격력 ${ST.dmg().toFixed(1)}</span><span class="chip">공격 속도 ×${ST.rate().toFixed(2)}</span><span class="chip">영웅 ${h.nm} Lv.${S.heroes[S.hero]}</span></div>
  <section class="ops">
    <div class="op run"><span class="eyebrow">돌격전</span><span class="stg">STAGE ${S.stage}</span>
      <span class="sub">게이트로 병사를 불리고 술통을 부숴 고블린 군단과 오우거를 쓰러뜨리세요.</span>
      <button class="btn-go" data-act="run">출전</button></div>
    <div class="op def"><span class="eyebrow">성 방어전</span><span class="stg">STAGE ${S.dstage}</span>
      <span class="sub">영웅을 움직여 코인을 줍고, 발판에 쇠뇌탑을 지어 성을 지키세요.</span>
      <button class="btn-go" data-act="def">방어 시작</button></div>
  </section>
  <h2>성채 · 생산</h2>
  <div class="grid">${BLD.filter(b=>b.id==='hq'||PROD[b.id]).map(card).join('')}</div>
  <h2>군사 시설</h2>
  <div class="grid">${BLD.filter(b=>b.id!=='hq'&&!PROD[b.id]).map(card).join('')}</div>
  <button class="reset" id="bReset">게임 데이터 초기화</button>`;
  paintRes();
}
function card(b){
  const lv=S.b[b.id],max=b.id==='hq'?HQMAX:S.b.hq,c=b.cost(lv);
  const store=PROD[b.id]?`<div class="bar"><i id="sb-${b.id}"></i></div><button class="btn collect" data-act="collect" data-id="${b.id}" id="cl-${b.id}">수확</button>`:'';
  const up=lv>=max?`<div class="maxed">${b.id==='hq'?'최고 레벨':'성채 레벨업 필요'}</div>`:`<button class="btn up" data-act="up" data-id="${b.id}" ${canPay(c)?'':'disabled'}>Lv.${lv+1} 업그레이드${costHTML(c)}</button>`;
  return `<div class="card"><div class="hd"><span class="nm">${b.nm}</span><span class="lv">Lv.${lv}</span></div><div class="desc">${b.desc(lv)}</div>${store}${up}</div>`;
}
function tickBase(){
  for(const id in PROD){
    const r=RATE[id](S.b[id]),cap=r*ST.cap(),v=S.store[id];
    const bar=document.getElementById('sb-'+id),btn=document.getElementById('cl-'+id);
    if(bar)bar.style.width=(v/cap*100).toFixed(1)+'%';
    if(btn){btn.textContent=v>=1?`수확 +${fmt(v)}`:'생산 중';btn.disabled=v<1}
  }
}
function renderHero(){
  $('#pHero').innerHTML=`<h2>영웅</h2><p class="desc" style="min-height:0;margin:0">출전할 영웅 한 명을 고르세요. 영웅 최대 레벨은 성채 레벨의 2배입니다.</p>`+
  Object.entries(HEROES).map(([id,h])=>{
    const lv=S.heroes[id],own=lv!=null,eq=S.hero===id;let acts='';
    if(!own)acts=`<button class="btn up" data-act="hire" data-id="${id}" ${canPay(h.unlock)?'':'disabled'}>영입${costHTML(h.unlock)}</button>`;
    else{
      const c=heroCost(lv);
      acts=(lv>=heroMax()?`<div class="maxed">성채 레벨업 필요</div>`:`<button class="btn up" data-act="hlv" data-id="${id}" ${canPay(c)?'':'disabled'}>Lv.${lv+1} 훈련${costHTML(c)}</button>`)+
        (eq?'':`<button class="btn" data-act="equip" data-id="${id}">출전 영웅으로</button>`);
    }
    return `<div class="card hero"><div class="portrait" style="background:${h.col}">${h.ch}</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <span class="role">${h.role}</span>
      <div class="hd" style="justify-content:flex-start"><span class="nm">${h.nm}</span>${eq?'<span class="tag">출전</span>':''}${own?`<span class="lv" style="margin-left:auto">Lv.${lv}</span>`:''}</div>
      <div class="desc" style="min-height:0">${h.desc(lv||1)}</div><div class="acts">${acts}</div></div></div>`}).join('');
  paintRes();
}
let tab='base';

function genRun(st){
  const R=rng(st*7919+13),M=Math.pow(1.14,st-1),sc=1+.08*(st-1);
  const L=Math.min(190+st*8,400),ents=[];let z=14,k=0,pid=0;
  const seq=['g','z','barrel','row','z','g','barrel','z','row','g','z'];
  const good=()=>{const r=R();return r<.6?{op:'+',v:Math.round((5+R()*11)*sc)}:r<.88?{op:'x',v:2}:{op:'x',v:3}};
  const bad=()=>R()<.72?{op:'+',v:-Math.round((4+R()*9)*sc)}:{op:'/',v:2};
  const gob=(x,z0,big)=>{const hp=(big?320:30)*M;ents.push({t:'z',x,z:z0,hp,mhp:hp,spd:big?.85:1.1+R()*.8,str:big?6:1,sz:big?1.9:1})};
  const zg=(z0,n)=>{for(let i=0;i<n;i++)gob(-W+.5+R()*(2*W-1),z0+R()*7);if(st>=3&&R()<.45)gob(-1.5+R()*3,z0+8,true)};
  while(z<L){
    const t=seq[k%seq.length];
    if(t==='g'){let a=good(),b=R()<.6?bad():good();if(st===1&&pid===0){a={op:'+',v:10};b={op:'x',v:2}}if(R()<.5)[a,b]=[b,a];
      ents.push({t:'g',z,x0:-W,x1:0,...a,pid,acc:0},{t:'g',z,x0:0,x1:W,...b,pid,acc:0});pid++;z+=20}
    else if(t==='z'){zg(z,Math.round(5+st*.9+R()*6));z+=24}
    else if(t==='row'){
      // 한쪽은 +1 게이트 줄, 반대쪽은 보라색 큰 곱하기 게이트
      const side=R()<.5?-1:1,n=10+Math.floor(R()*5),step=Math.max(1,Math.round(sc));
      for(let i=0;i<n;i++)ents.push({t:'g',z:z+i*1.15,x0:side<0?-W:0,x1:side<0?0:W,op:'+',v:step,pid:pid++,acc:0,small:1,noShoot:1});
      ents.push({t:'g',z:z+n*1.15*.55,x0:side<0?0:-W,x1:side<0?W:0,op:'x',v:R()<.65?3:5,pid:pid++,acc:0,purple:1,noShoot:1});

      const king=st>=2&&R()<.35,side=R()<.5?-1.6:1.6,hp=(king?900:220)*M;
      ents.push({t:'c',x:side,z,hp,mhp:hp,kind:king?'king':'men',amt:king?Math.round(25*sc):Math.round(9*sc)});
      if(R()<.6){const hp2=(king?220:520)*M;ents.push({t:'c',x:side,z:z+3.2,hp:hp2,mhp:hp2,kind:king?'men':'king',amt:king?Math.round(9*sc):Math.round(25*sc)})}
      if(R()<.5)zg(z+8,Math.round(3+st*.4));z+=20}
    k++;
  }
  // 최종 고블린 군단
  const army=Math.min(30+st*6,160),cols=12;
  for(let i=0;i<army;i++)gob(-W+.4+(i%cols)*(2*W-.8)/(cols-1),L+4+Math.floor(i/cols)*.7,false);
  const bh=1800*M;const boss={t:'b',x:0,z:L+4+Math.ceil(army/cols)*.7+8,hp:bh,mhp:bh,spd:1.1,dps:3+st*.6,sz:3.2};

}

function proj(x,z,h=0){const d=z-(B.sqZ-CAMD);if(d<.35)return null;const s=F/d;return{x:VW/2+x*s,y:HY+(CAMH-h)*s,s,d}}

function runHit(e,d){

function shoot(e,n,h=.6){

function volley(dt){

  const tg=B.ents.filter(e=>!e.dead&&(e.t==='z'||e.t==='b')&&e.z>B.sqZ-.3&&e.z-B.sqZ<RANGE).sort((a,b)=>a.z-b.z);

function runUpdate(dt,frozen){
  B.t+=dt;

  const boss=B.boss;
  if(!frozen){
    if(keys.l)B.tx-=7*dt;if(keys.r)B.tx+=7*dt;

    const r=cr();
    for(const e of B.ents){
      if(e.dead)continue;

          const before=B.N;
          if(e.op==='+')B.N+=e.v;else if(e.op==='x')B.N*=e.v;else B.N=Math.ceil(B.N/e.v);

        if(e.z-B.sqZ<.55&&e.z-B.sqZ>-.8&&Math.abs(e.x-B.sqX)<r+.3*e.sz){B.N=Math.max(0,B.N-e.str);e.dead=true;burst(e.x,e.z,.5,'#c0392b',8)}
      }
      if(e.t==='b'&&e.z-B.sqZ<34){

}

function quad(x0,z0,x1,z1,col,h0=0,h1=h0){const a=proj(x0,z0,h0),b=proj(x1,z0,h1),cc=proj(x1,z1,h1),d=proj(x0,z1,h0);if(!a||!b||!cc||!d)return;c.fillStyle=col;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.lineTo(cc.x,cc.y);c.lineTo(d.x,d.y);c.fill()}
function runBg(){
  const camZ=B.sqZ-CAMD,z0=camZ+.5,z1=camZ+70;
  c.fillStyle='#16110d';c.fillRect(0,0,VW,VH);
  // 바깥 흙/어둠
  quad(-W-6,z0,W+6,z1,'#2a2019');
  // 돌길
  quad(-W,z0,W,z1,'#c4bdb1');
  c.strokeStyle='rgba(120,110,98,.55)';c.lineWidth=1;
  for(let z=Math.floor(camZ/1.5)*1.5;z<z1;z+=1.5){if(z<z0)continue;const a=proj(-W,z),b=proj(W,z);if(a&&b){c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}}
  for(let x=-W+1.5;x<W;x+=1.5){const a=proj(x,z0),b=proj(x,z1);c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}
  // 성벽 양쪽 (높이 있는 돌벽)
  for(const s of[-1,1]){
    const xi=s*W,xo=s*(W+.45);
    quad(xi,z0,xo,z1,'#8d857a',.45);
    quad(Math.min(xi,xo),z0,Math.max(xi,xo),z1,'#a59d91',.45);
  }
  // 횃불
  for(let i=Math.floor((camZ+70)/9);i>=Math.floor(camZ/9);i--){
    const z=i*9+4;if(z<z0)continue;
    for(const s of[-1,1]){const p=proj(s*(W+.22),z,.9);if(!p)continue;c.globalAlpha=fog(p.d);glow(p.x,p.y,p.s*1.4,'rgba(255,160,60,.45)');c.fillStyle='#ffd27a';c.beginPath();c.arc(p.x,p.y,Math.max(1.5,p.s*.08),0,7);c.fill();c.globalAlpha=1}
  }
  // 먼 곳 어둠
  const g=c.createLinearGradient(0,0,0,VH*.35);g.addColorStop(0,'rgba(10,8,6,1)');g.addColorStop(1,'rgba(10,8,6,0)');c.fillStyle=g;c.fillRect(0,0,VW,VH*.35);
}
function shadow(p,w){c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(p.x,p.y,w*p.s,w*.35*p.s,0,0,Math.PI*2);c.fill()}
function knight(p,sz,armor,trim){
  const s=p.s*sz,w=.24*s,h=.38*s;

  c.fillStyle=trim;c.fillRect(p.x-w/2,p.y-h*.62,w,h*.08);
  c.fillStyle='#c9d3dc';c.beginPath();c.moveTo(p.x-.1*s,p.y-h);c.lineTo(p.x+.1*s,p.y-h);c.lineTo(p.x,p.y-h-.22*s);c.fill();
  c.fillStyle='#8f9aa5';c.fillRect(p.x+w*.5,p.y-h*1.25,Math.max(1,w*.12),h*.95);

}
function goblin(p,sz,body){

  c.fillStyle='#8fc85a';c.beginPath();c.arc(p.x,p.y-h-.08*s,.1*s,0,7);c.fill();

  c.beginPath();c.moveTo(p.x+.09*s,p.y-h-.1*s);c.lineTo(p.x+.2*s,p.y-h-.16*s);c.lineTo(p.x+.07*s,p.y-h-.03*s);c.fill();
  c.fillStyle='#ff3b30';c.fillRect(p.x-.045*s,p.y-h-.1*s,.03*s,.025*s);c.fillRect(p.x+.015*s,p.y-h-.1*s,.03*s,.025*s);

function drawSquad(){
  const n=Math.min(Math.round(B.N),160),idx=[];for(let i=0;i<n;i++)idx.push(i);

  const hp=proj(B.sqX,B.sqZ-.5-cr()*.6);
  if(hp){shadow(hp,.24);c.strokeStyle='#5dff7a';c.lineWidth=2;c.beginPath();c.ellipse(hp.x,hp.y,.38*hp.s,.14*hp.s,0,0,7);c.stroke();knight(hp,1.7,HEROES[B.hid].col,'#2f7fd6')}

    c.fillStyle='#1f6fc4';rrect(b.x-tw/2,b.y-th,tw,th,6);c.fill();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(t,b.x,b.y-th/2+1)}

function drawGob(e){

  if(e.sz>1&&e.hp<e.mhp){const w=.6*p.s*e.sz;c.fillStyle='#000a';c.fillRect(p.x-w/2,p.y-f.h-.35*f.s,w,4);c.fillStyle='#ff5b4f';c.fillRect(p.x-w/2,p.y-f.h-.35*f.s,w*e.hp/e.mhp,4)}

function drawOgre(x,y,s,t){

  c.fillStyle='#3a2a1a';c.fillRect(x-w*.42,y-h*.35,w*.32,h*.35);c.fillRect(x+w*.1,y-h*.35,w*.32,h*.35);
  c.fillStyle='#8a3b2b';c.fillRect(x-w/2,y-h,w,h*.72);

  c.fillStyle='#6b4a2a';c.save();c.translate(x+w*.95,y-h*.85);c.rotate(-.5+Math.sin(t*4)*.3);c.fillRect(-w*.08,-h*.9,w*.22,h*.9);c.fillStyle='#bfc5ca';for(let k=0;k<3;k++)c.fillRect(-w*.16,-h*(.3+k*.22),w*.38,h*.05);c.restore();
  c.fillStyle='#c98a6a';c.beginPath();c.arc(x,y-h-.1*s,.12*s,0,7);c.fill();
  c.fillStyle='#efe6d0';c.beginPath();c.moveTo(x-.1*s,y-h-.16*s);c.quadraticCurveTo(x-.3*s,y-h-.25*s,x-.26*s,y-h-.4*s);c.lineTo(x-.06*s,y-h-.2*s);c.fill();
  c.beginPath();c.moveTo(x+.1*s,y-h-.16*s);c.quadraticCurveTo(x+.3*s,y-h-.25*s,x+.26*s,y-h-.4*s);c.lineTo(x+.06*s,y-h-.2*s);c.fill();
  c.fillStyle='#ff2d20';c.fillRect(x-.06*s,y-h-.13*s,.035*s,.03*s);c.fillRect(x+.025*s,y-h-.13*s,.035*s,.03*s);

function drawBoss(e){const p=proj(e.x,e.z);if(!p)return;c.globalAlpha=fog(p.d);shadow(p,.55);drawOgre(p.x,p.y,p.s*e.sz,B.t);c.globalAlpha=1}
function gateLabel(e){return e.op==='+'?(e.v>=0?'+':'')+e.v:e.op==='x'?'×'+e.v:'÷'+e.v}
function drawGate(e){
  const hgt=e.small?1.1:e.purple?1.3:2.1,inset=e.small?.25:.08;
  const a=proj(e.x0+inset,e.z,0),b=proj(e.x1-inset,e.z,hgt);if(!a||!b)return;
  const good=(e.op==='+'&&e.v>=0)||e.op==='x';
  const col=e.purple?'166,107,255':good?'74,163,255':'255,91,79';
  c.globalAlpha=fog(a.d)*(e.used?.25:1);
  c.fillStyle=`rgba(${col},${e.small||e.purple?.85:.4})`;c.fillRect(a.x,b.y,b.x-a.x,a.y-b.y);
  c.fillStyle=`rgb(${col})`;c.fillRect(a.x,b.y,b.x-a.x,Math.max(3,a.s*.1));
  const pw2=Math.max(2,a.s*.08);c.fillStyle='#7a5a2e';c.fillRect(a.x-pw2,b.y-pw2,pw2,a.y-b.y+pw2);c.fillRect(b.x,b.y-pw2,pw2,a.y-b.y+pw2);
  outlined(gateLabel(e),(a.x+b.x)/2,(a.y+b.y)/2,Math.max(9,a.s*(e.small?.5:e.purple?.7:.75)),'#fff');
  c.globalAlpha=1;
}
function drawBarrel(e){
  const a=proj(e.x-.6,e.z,0),b=proj(e.x+.6,e.z,1.5);if(!a||!b)return;c.globalAlpha=fog(a.d);

  c.fillStyle='#b8792f';rrect(x,y,w,h,w*.12);c.fill();
  c.fillStyle='#d69a4a';c.fillRect(x+w*.12,y,w*.76,h);
  c.fillStyle='#8a929b';for(const f of[.12,.5,.88])c.fillRect(x,y+h*f-h*.03,w,h*.06);
  c.fillStyle='#9a6326';c.beginPath();c.ellipse(x+w/2,y,w/2,ry,0,0,7);c.fill();
  c.fillStyle='#6e4518';c.beginPath();c.ellipse(x+w/2,y,w*.42,ry*.75,0,0,7);c.fill();

  else knight(ip,1,'#5b6b7a','#c9d3dc');
  outlined(fmt(Math.ceil(e.hp)),x+w/2,y+h*.9,Math.max(10,a.s*.42),'#fff');
  c.globalAlpha=1;
}
function runDraw(){
  runBg();
  const list=B.ents.filter(e=>!e.dead||e.t==='b').map(e=>({z:e.z,e}));
  list.push({z:B.sqZ,sq:1});list.sort((a,b)=>b.z-a.z);
  for(const it of list){
    if(it.sq){drawSquad();continue}
    const e=it.e;if(e.t==='b'&&e.dead)continue;
    if(e.t==='z')drawGob(e);else if(e.t==='g')drawGate(e);else if(e.t==='c')drawBarrel(e);else if(e.t==='b')drawBoss(e);
  }
  for(const s of B.shots){
    const a=proj(s.x0,s.z0,.45),b=proj(s.x1,s.z1,s.h1);if(!a||!b)continue;
    const t=1-s.life/s.max;c.strokeStyle=s.hero===1?'#ffe08a':s.hero===2?'#ff8a3d':'#f4e2b0';c.lineWidth=s.hero?3:1.5;c.globalAlpha=.9;
    c.beginPath();c.moveTo(a.x+(b.x-a.x)*t*.6,a.y+(b.y-a.y)*t*.6);c.lineTo(a.x+(b.x-a.x)*Math.min(1,t+.4),a.y+(b.y-a.y)*Math.min(1,t+.4));c.stroke();

  c.globalAlpha=1;

/* =========================================================
   성 방어전 (영웅 이동 + 코인 + 쇠뇌탑)
   ========================================================= */
const MAP={w:10,h:17,
  path:[[-0.8,16.2],[1.8,15.4],[3.4,13.6],[2.2,11.6],[3.2,9.8],[6.4,10.2],[8.2,8.4],[7.4,6.2],[5,5.4],[5,3.2]],
  castle:[5,1.9],
  pads:[[1.1,13.0,15],[4.8,12.4,15],[5.0,8.4,20],[1.4,9.6,20],[8.8,11.2,25],[3.0,6.6,25],[8.4,5.0,30],[2.7,3.6,30]]};
(()=>{const P=MAP.path;MAP.seg=[];let L=0;for(let i=0;i<P.length-1;i++){const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]);MAP.seg.push({a:P[i],b:P[i+1],L0:L,d});L+=d}MAP.len=L})();
function pathAt(dist){
  for(const s of MAP.seg)if(dist<=s.L0+s.d){const t=(dist-s.L0)/s.d,dx=(s.b[0]-s.a[0])/s.d,dy=(s.b[1]-s.a[1])/s.d;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t,nx:-dy,ny:dx}}
  const s=MAP.seg[MAP.seg.length-1];return{x:s.b[0],y:s.b[1],nx:0,ny:0};
}
const DEC=(()=>{const R=rng(42),rocks=[],candles=[];
  for(let i=0;i<70;i++)rocks.push([R()*11-.5,R()*17.5,.3+R()*.9,R()]);
  for(let i=0;i<16;i++)candles.push([R()*10,1+R()*15.5,R()*6]);
  return{rocks,candles}})();
function defWaves(d){
  const R=rng(d*131+7),waves=[];
  for(let w=0;w<5;w++){
    const q=[];let t=0;
    const gN=6+w*3+d,oN=w>=1?w+Math.floor(d/2):0;
    for(let i=0;i<gN;i++){q.push({k:'gob',t});t+=.55+R()*.4}
    for(let i=0;i<oN;i++)q.splice(Math.floor(R()*q.length),0,{k:'orc',t:0});
    if(w===4)q.push({k:'ogre',t:0});
    q.forEach((e,i)=>e.t=i*.62);
    waves.push(q);
  }
  return waves;
}
const EN={gob:{hp:22,spd:1.15,dmg:1,r:.22,coins:1},orc:{hp:95,spd:.8,dmg:3,r:.32,coins:4},ogre:{hp:900,spd:.5,dmg:10,r:.6,coins:20}};
let DS=1,DOX=0,DOY=0;
function defLayout(){const top=70,bot=20;DS=Math.min(VW/MAP.w,(VH-top-bot)/MAP.h);DOX=(VW-MAP.w*DS)/2;DOY=top+(VH-top-bot-MAP.h*DS)/2}
const sx=x=>DOX+x*DS,sy=y=>DOY+y*DS;
function startDef(){

     shots:[],parts:[],floats:[],waves:defWaves(d),wave:-1,queue:[],qt:0,waveT:2.5,shake:0,t:0,fireCd:0,heroCd:1.5,
     hid,hlv:S.heroes[hid],joy:null,layout:defLayout,update:defUpdate,draw:defDraw,
     onDown:e=>{const r=cv.getBoundingClientRect();B.joy={ox:e.clientX-r.left,oy:e.clientY-r.top,dx:0,dy:0}},

const heroDmg=()=>ST.dmg()*1.6*(1+.15*(B.hlv-1));
const towerDmg=lv=>14*B.M*(1+.7*(lv-1));
function dFloat(x,y,text,col,size=18){B.floats.push({x,y,text,col,life:1.1,size})}
function dBurst(x,y,col,n,sp=2){for(let i=0;i<n&&B.parts.length<500;i++){const a=Math.random()*7,v=Math.random()*sp;B.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.4+Math.random()*.4,col})}}
function defHit(e,d){
  if(e.dead)return;e.hp-=d;
  if(e.hp<=0){
    e.dead=true;dBurst(e.x,e.y,'#8fc85a',e.k==='ogre'?30:8,e.k==='ogre'?4:2);
    const n=EN[e.k].coins;for(let i=0;i<n;i++){const a=Math.random()*7,v=.6+Math.random()*1.4;B.drops.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,z:0,vz:2+Math.random()*1.5,age:0,fly:false})}
  }

function nearestEnemy(x,y,range){let best=null,bd=range;for(const e of B.enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y)-EN[e.k].r;if(d<bd){bd=d;best=e}}return best}
function defUpdate(dt,frozen){
  B.t+=dt;if(B.t>4)$('#hint').style.opacity=0;
  const H=B.hero;
  if(!frozen){
    // 이동
    let mx=(keys.r?1:0)-(keys.l?1:0),my=(keys.dn?1:0)-(keys.u?1:0);
    if(B.joy){const l=Math.hypot(B.joy.dx,B.joy.dy);if(l>6){mx=B.joy.dx/Math.max(l,40);my=B.joy.dy/Math.max(l,40)}}
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
    H.x=clamp(H.x+mx*4.2*dt,.3,MAP.w-.3);H.y=clamp(H.y+my*4.2*dt,3,MAP.h-.3);
    if(Math.abs(mx)>.1)H.face=Math.sign(mx);H.moving=ml>.1;
    // 웨이브
    if(B.wave<B.waves.length&&!B.queue.length&&!B.enemies.some(e=>!e.dead)){
      if(B.wave===B.waves.length-1){finish(true)}
      else{B.waveT-=dt;if(B.waveT<=0){B.wave++;B.queue=B.waves[B.wave].slice();B.qt=0;B.waveT=3.5;
        dFloat(MAP.w/2,8,B.wave===B.waves.length-1?'보스 웨이브!':`WAVE ${B.wave+1}`,B.wave===B.waves.length-1?'#ff5b4f':'#ffd166',34);
        for(const dr of B.drops)dr.fly=true;defBuffs()}}
    }
    B.qt+=dt;
    while(B.queue.length&&B.queue[0].t<=B.qt){const q=B.queue.shift(),s=EN[q.k],hp=s.hp*B.M;
      B.enemies.push({k:q.k,dist:0,off:(Math.random()-.5)*.8,hp,mhp:hp,x:MAP.path[0][0],y:MAP.path[0][1]});
      if(q.k==='ogre')$('#hBossRow').hidden=false}
    // 적 이동
    for(const e of B.enemies){if(e.dead)continue;e.dist+=EN[e.k].spd*dt;
      const p=pathAt(e.dist);e.x=p.x+p.nx*e.off;e.y=p.y+p.ny*e.off;
      if(e.dist>=MAP.len){e.dead=true;e.leak=true;B.castle-=EN[e.k].dmg;B.shake=.3;dBurst(MAP.castle[0],MAP.castle[1]+.8,'#ff5b4f',12);dFloat(MAP.castle[0],MAP.castle[1]+1,`-${EN[e.k].dmg}`,'#ff8a80')}}
    // 영웅 공격
    B.fireCd-=dt;
    if(B.fireCd<=0){const tg=nearestEnemy(H.x,H.y,3.4);if(tg){B.fireCd=.33/ST.rate();H.face=Math.sign(tg.x-H.x)||H.face;B.shots.push({x0:H.x,y0:H.y-.3,x1:tg.x,y1:tg.y,life:.12,max:.12,col:'#ffe27a',w:3});defHit(tg,heroDmg())}else B.fireCd=0}
    // 영웅 스킬
    B.heroCd-=dt;
    if(B.heroCd<=0){const h=HEROES[B.hid],lv=B.hlv;
      if(B.hid==='hanna'){B.heroCd=6;if(B.castle<B.castleMax){B.castle=Math.min(B.castleMax,B.castle+h.pow(lv));dFloat(MAP.castle[0],MAP.castle[1]+1,`+${h.pow(lv)}`,'#7fe0c4')}}
      else{const tg=nearestEnemy(H.x,H.y,4.5);
        if(!tg)B.heroCd=.2;
        else if(B.hid==='raven'){B.shots.push({x0:H.x,y0:H.y-.3,x1:tg.x,y1:tg.y,life:.2,max:.2,col:'#fff1b0',w:5});defHit(tg,h.pow(lv)*B.M**.5);B.heroCd=1.2}
        else{dBurst(tg.x,tg.y,'#ff8a3d',26,3);for(const e of B.enemies)if(!e.dead&&Math.hypot(e.x-tg.x,e.y-tg.y)<1.6)defHit(e,h.pow(lv)*B.M**.5);B.shots.push({x0:H.x,y0:H.y-.3,x1:tg.x,y1:tg.y,life:.25,max:.25,col:'#ff8a3d',w:6});B.heroCd=2.5}}}
    // 쇠뇌탑
    for(const tw of B.towers){
      const dh=Math.hypot(H.x-tw.x,H.y-tw.y);
      if(dh<.6){
        if(!tw.done){tw.hold+=dt;
          if(tw.hold>=.45){tw.done=true;const cost=tw.lv?tw.cost*(tw.lv+1):tw.cost;
            if(tw.lv>=5)dFloat(tw.x,tw.y-.8,'최대 레벨','#ffd166');
            else if(B.coins>=cost){B.coins-=cost;tw.lv++;dBurst(tw.x,tw.y,'#ffd166',24,3);dFloat(tw.x,tw.y-.9,tw.lv===1?'쇠뇌탑 건설!':`쇠뇌탑 Lv.${tw.lv}`,'#ffd166');defBuffs()}
            else dFloat(tw.x,tw.y-.8,`코인 ${cost} 필요`,'#ff8a80')}}
      }else{tw.hold=0;tw.done=false}
      if(tw.lv){tw.cd-=dt;const tg=nearestEnemy(tw.x,tw.y,3+.3*tw.lv);
        if(tg){tw.ang=Math.atan2(tg.y-tw.y,tg.x-tw.x);if(tw.cd<=0){tw.cd=.75;B.shots.push({x0:tw.x,y0:tw.y-.5,x1:tg.x,y1:tg.y,life:.15,max:.15,col:'#e8d9b5',w:2.5});defHit(tg,towerDmg(tw.lv))}}}
    }
    // 코인
    for(const dr of B.drops){dr.age+=dt;
      if(dr.z>0||dr.vz>0){dr.x+=dr.vx*dt;dr.y+=dr.vy*dt;dr.z+=dr.vz*dt;dr.vz-=9*dt;if(dr.z<0){dr.z=0;dr.vz=0}}
      const d=Math.hypot(H.x-dr.x,H.y-dr.y);
      if(dr.age>.4&&(d<1.7||dr.fly)){const sp=dr.fly?14:9;dr.x+=(H.x-dr.x)/Math.max(d,.01)*Math.min(d,sp*dt);dr.y+=(H.y-dr.y)/Math.max(d,.01)*Math.min(d,sp*dt)}
      if(dr.age>.4&&d<.3){dr.got=true;B.coins++}}
    if(B.drops.some(d=>d.got))defBuffs();
    B.drops=B.drops.filter(d=>!d.got);
    if(B.castle<=0){B.castle=0;finish(false)}
  }
  B.enemies=B.enemies.filter(e=>!e.dead);
  for(const p of B.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}B.parts=B.parts.filter(p=>p.life>0);
  for(const f of B.floats){f.y-=.9*dt;f.life-=dt}B.floats=B.floats.filter(f=>f.life>0);
  for(const s of B.shots)s.life-=dt;B.shots=B.shots.filter(s=>s.life>0);
  B.shake=Math.max(0,B.shake-dt);
  $('#hProg').style.width=(B.castle/B.castleMax*100)+'%';
  const og=B.enemies.find(e=>e.k==='ogre');if(og)$('#hBoss').style.width=(og.hp/og.mhp*100)+'%';
}
function defBuffs(){
  const coin='<svg class="ico" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#ffc93c" stroke="#b9860b" stroke-width="1.5"/></svg>';
  $('#hBuffs').innerHTML=`<span class="chip">${coin} ${B.coins}</span><span class="chip">WAVE ${Math.max(1,B.wave+1)}/${B.waves.length}</span><span class="chip">성벽 ${Math.ceil(B.castle)}</span><span class="chip">${HEROES[B.hid].nm} Lv.${B.hlv}</span>`;
}
function defDraw(){
  c.save();
  if(B.shake>0)c.translate((Math.random()-.5)*8*B.shake,(Math.random()-.5)*8*B.shake);
  c.fillStyle='#17120e';c.fillRect(-10,-10,VW+20,VH+20);
  // 동굴 바위
  for(const r of DEC.rocks){c.fillStyle=r[3]<.5?'#241c16':'#2c231b';c.beginPath();c.ellipse(sx(r[0]),sy(r[1]),r[2]*DS,r[2]*DS*.7,r[3]*3,0,7);c.fill()}
  // 길 (계단)
  const P=MAP.path;
  c.lineCap='round';c.lineJoin='round';
  const stroke=(w,col)=>{c.strokeStyle=col;c.lineWidth=w*DS;c.beginPath();c.moveTo(sx(P[0][0]),sy(P[0][1]));for(const p of P)c.lineTo(sx(p[0]),sy(p[1]));c.lineTo(sx(MAP.castle[0]),sy(MAP.castle[1]));c.stroke()};
  stroke(1.9,'#4a3a2c');stroke(1.55,'#b48a57');stroke(1.25,'#d2aa72');
  c.strokeStyle='rgba(90,60,30,.35)';c.lineWidth=Math.max(1,DS*.05);
  for(let d=.3;d<MAP.len;d+=.42){const p=pathAt(d);c.beginPath();c.moveTo(sx(p.x+p.nx*.62),sy(p.y+p.ny*.62));c.lineTo(sx(p.x-p.nx*.62),sy(p.y-p.ny*.62));c.stroke()}
  // 촛불
  for(const k of DEC.candles){const x=sx(k[0]),y=sy(k[1]),f=.8+Math.sin(B.t*8+k[2])*.2;glow(x,y,DS*.9*f,'rgba(255,170,70,.35)');c.fillStyle='#efe1c0';c.fillRect(x-DS*.04,y-DS*.05,DS*.08,DS*.14);c.fillStyle='#ffcf5a';c.beginPath();c.arc(x,y-DS*.09,DS*.05*f,0,7);c.fill()}
  // 성 + 금화 더미
  const cx0=sx(MAP.castle[0]),cy0=sy(MAP.castle[1]);
  glow(cx0,cy0,DS*3.2,'rgba(255,190,70,.35)');
  c.fillStyle='#d9a12a';c.beginPath();c.ellipse(cx0,cy0+DS*.3,DS*2.6,DS*1.5,0,0,7);c.fill();
  const R=rng(9);for(let i=0;i<70;i++){const a=R()*7,rr=Math.sqrt(R());c.fillStyle=R()<.5?'#ffd75a':'#f2b631';c.beginPath();c.ellipse(cx0+Math.cos(a)*rr*DS*2.5,cy0+DS*.3+Math.sin(a)*rr*DS*1.4,DS*.12,DS*.08,0,0,7);c.fill()}
  c.fillStyle='#6d5a49';c.beginPath();c.arc(cx0,cy0-DS*.2,DS*1.05,0,7);c.fill();
  c.fillStyle='#8a7560';c.beginPath();c.arc(cx0,cy0-DS*.35,DS*.8,0,7);c.fill();
  c.fillStyle='#ffb648';c.fillRect(cx0-DS*.12,cy0+DS*.45,DS*.24,DS*.35);
  for(const[ax,ay]of[[-1,-.4],[1,-.4],[-.75,.55],[.75,.55]]){const x=cx0+ax*DS*1.05,y=cy0+ay*DS*1.05;c.fillStyle='#6d5a49';c.beginPath();c.arc(x,y,DS*.32,0,7);c.fill();c.fillStyle='#2f55b8';c.beginPath();c.moveTo(x-DS*.34,y);c.lineTo(x+DS*.34,y);c.lineTo(x,y-DS*.75);c.fill()}
  c.fillStyle='#7a2a20';c.fillRect(cx0-DS*.02,cy0-DS*1.6,DS*.05,DS*.9);c.fillStyle='#d8392b';c.fillRect(cx0+DS*.03,cy0-DS*1.6,DS*.4,DS*.25);
  // 발판 / 탑
  for(const tw of B.towers){
    const x=sx(tw.x),y=sy(tw.y),s=DS*.62;
    c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillStyle='#211b17';c.fillRect(-s,-s,s*2,s*2);c.strokeStyle='#e8d9b5';c.lineWidth=Math.max(1.5,DS*.06);c.strokeRect(-s*.85,-s*.85,s*1.7,s*1.7);c.restore();
    if(!tw.lv){outlined(String(tw.cost),x,y-DS*.08,DS*.5,'#f4ead3','#000');c.fillStyle='#ffc93c';c.beginPath();c.arc(x,y+DS*.32,DS*.13,0,7);c.fill()}
    if(tw.hold>0&&!tw.done){c.strokeStyle='#5dff7a';c.lineWidth=4;c.beginPath();c.arc(x,y,DS*.75,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,tw.hold/.45));c.stroke()}
  }
  // 깊이 정렬: 탑, 적, 영웅, 코인
  const items=[];
  for(const tw of B.towers)if(tw.lv)items.push({y:tw.y,f:()=>drawTower(tw)});
  for(const e of B.enemies)items.push({y:e.y,f:()=>drawEnemy(e)});
  for(const dr of B.drops)items.push({y:dr.y-.01,f:()=>{const x=sx(dr.x),y=sy(dr.y)-dr.z*DS*.5;c.fillStyle='#b9860b';c.beginPath();c.ellipse(x,y+DS*.03,DS*.14,DS*.1,0,0,7);c.fill();c.fillStyle='#ffd23f';c.beginPath();c.ellipse(x,y,DS*.14,DS*.1,0,0,7);c.fill()}});
  items.push({y:B.hero.y,f:drawHero});
  items.sort((a,b)=>a.y-b.y);for(const it of items)it.f();
  for(const s of B.shots){const t=1-s.life/s.max,x0=sx(s.x0),y0=sy(s.y0),x1=sx(s.x1),y1=sy(s.y1);c.strokeStyle=s.col;c.lineWidth=s.w;c.globalAlpha=.95;c.beginPath();c.moveTo(x0+(x1-x0)*Math.max(0,t-.35),y0+(y1-y0)*Math.max(0,t-.35));c.lineTo(x0+(x1-x0)*Math.min(1,t+.25),y0+(y1-y0)*Math.min(1,t+.25));c.stroke();c.globalAlpha=1}
  for(const p of B.parts){c.globalAlpha=clamp(p.life*2,0,1);c.fillStyle=p.col;const r=DS*.08;c.fillRect(sx(p.x)-r/2,sy(p.y)-r/2,r,r)}
  c.globalAlpha=1;
  for(const f of B.floats){c.globalAlpha=clamp(f.life*1.5,0,1);outlined(f.text,sx(f.x),sy(f.y),f.size,f.col,'#000')}
  c.globalAlpha=1;
  if(B.joy&&drag){c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=2;c.beginPath();c.arc(B.joy.ox,B.joy.oy,40,0,7);c.stroke();const l=Math.hypot(B.joy.dx,B.joy.dy),k=l>40?40/l:1;c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(B.joy.ox+B.joy.dx*k,B.joy.oy+B.joy.dy*k,16,0,7);c.fill()}
  c.restore();
}
function drawTower(tw){
  const x=sx(tw.x),y=sy(tw.y),s=DS;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x,y+s*.15,s*.55,s*.25,0,0,7);c.fill();
  c.fillStyle='#7d7268';c.fillRect(x-s*.42,y-s*1.1,s*.84,s*1.15);
  c.fillStyle='#9a8e82';c.fillRect(x-s*.42,y-s*1.1,s*.84,s*.18);
  for(let i=0;i<3;i++){c.fillStyle='#9a8e82';c.fillRect(x-s*.42+i*s*.32,y-s*1.3,s*.2,s*.22)}
  c.fillStyle='#2f55b8';c.fillRect(x-s*.42,y-s*.75,s*.84,s*.1);
  // 쇠뇌
  c.save();c.translate(x,y-s*1.2);c.rotate(tw.ang+Math.PI/2);c.strokeStyle='#5a3a1a';c.lineWidth=s*.09;c.beginPath();c.moveTo(0,s*.25);c.lineTo(0,-s*.4);c.stroke();c.beginPath();c.arc(0,-s*.12,s*.35,Math.PI*1.1,Math.PI*1.9);c.stroke();c.restore();
  for(let i=0;i<tw.lv;i++){c.fillStyle='#ffd166';c.beginPath();c.arc(x-s*.32+i*s*.16,y-s*.3,s*.05,0,7);c.fill()}
}
function drawEnemy(e){
  const s=EN[e.k],x=sx(e.x),y=sy(e.y),bob=Math.sin(B.t*10+e.off*9)*DS*.03;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(x,y+DS*.05,DS*s.r*1.1,DS*s.r*.5,0,0,7);c.fill();
  if(e.k==='ogre')drawOgre(x,y,DS*2.1,B.t);
  else{const g=goblin({x,y:y+bob,s:DS*(e.k==='orc'?1.35:.95)},1,e.k==='orc'?'#6a4a3a':'#a3412f')}
  if(e.hp<e.mhp){const w=DS*s.r*2.4,top=y-DS*(e.k==='ogre'?1.6:e.k==='orc'?.85:.6);c.fillStyle='#000a';c.fillRect(x-w/2,top,w,4);c.fillStyle='#ff5b4f';c.fillRect(x-w/2,top,w*e.hp/e.mhp,4)}
}
function drawHero(){
  const H=B.hero,x=sx(H.x),y=sy(H.y),s=DS;
  c.strokeStyle='rgba(93,255,122,.9)';c.lineWidth=2.5;c.beginPath();c.ellipse(x,y,s*.42,s*.2,0,0,7);c.stroke();
  c.strokeStyle='rgba(255,255,255,.08)';c.lineWidth=1;c.beginPath();c.arc(x,y,s*3.4,0,7);c.stroke();
  const bob=H.moving?Math.abs(Math.sin(B.t*12))*s*.06:0;
  knight({x,y:y-bob,s:s*1.45},1,HEROES[B.hid].col,'#2f7fd6');
  c.fillStyle='#2f55b8';c.fillRect(x-s*.17*H.face-s*.06,y-bob-s*.5,s*.12,s*.4);
  c.fillStyle='#ffd166';const cy=y-bob-s*.82;c.beginPath();c.moveTo(x-s*.12,cy);c.lineTo(x-s*.12,cy-s*.12);c.lineTo(x-s*.05,cy-s*.06);c.lineTo(x,cy-s*.15);c.lineTo(x+s*.05,cy-s*.06);c.lineTo(x+s*.12,cy-s*.12);c.lineTo(x+s*.12,cy);c.fill();
}

/* ---------- 시작 ---------- */
function boot(){
  const away=(Date.now()-S.last)/6e4;accrue();save();setTab('base');
  if(away>5)toast('자리를 비운 동안 자원이 생산되었습니다');
  setInterval(()=>{accrue();if(!B&&tab==='base')tickBase();},1000);
  setInterval(save,10000);
  addEventListener('visibilitychange',()=>{if(document.hidden){accrue();save()}});
}
boot();
})();
</script>
